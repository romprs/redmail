[project]
name = "redmail"
version = "0.0.1"
description = "Прототип почтового клиента для RED OS (Фаза 0)"
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "imapclient",
    "keyring",
    "icalendar",
    "python-dateutil",
]

[project.scripts]
redmail = "redmail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
