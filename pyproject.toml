[project]
name = "redmail"
version = "0.0.1"
description = "Прототип почтового клиента для RED OS (Фаза 0)"
requires-python = ">=3.9"
dependencies = [
    "PySide6",
    "imapclient",
    "keyring",
    "icalendar",
    "python-dateutil",
    "vobject",
    # caldav >= 2.2 (и все 3.x) тянет icalendar-searcher под AGPL-3.0 и
    # niquests (HTTP/2, с которым PUT на корпоративном прокси рвался) -
    # для проприетарного продукта AGPL-компонент недопустим (реестр
    # российского ПО, лицензионная чистота), поэтому держимся на 2.0.x:
    # requests/HTTP/1.1, только BSD/LGPL/Apache-зависимости.
    "caldav>=2.0,<2.1",
    "requests",
    "libpff-python",
    "exchangelib",
    "requests-gssapi",
    "gssapi",
]

[project.scripts]
redmail = "redmail.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
